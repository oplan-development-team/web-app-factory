<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; }
    a { color: #6b5b95; }
    a:hover { color: #4a3d73; }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: linear-gradient(160deg, #f3eefc 0%, #e7ecfb 38%, #eaf3fb 68%, #f6efe f 100%); font-family: 'Outfit', sans-serif;">

  <!-- ambient backdrop glow -->
  <div style="position: absolute; left: -220px; top: -260px; width: 780px; height: 780px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,224,0.55) 0%, rgba(255,214,224,0) 70%); filter: blur(10px);"></div>
  <div style="position: absolute; right: -260px; bottom: -300px; width: 820px; height: 820px; border-radius: 50%; background: radial-gradient(circle, rgba(198,214,255,0.55) 0%, rgba(198,214,255,0) 70%); filter: blur(10px);"></div>
  <div style="position: absolute; left: 42%; top: 8%; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(226,255,238,0.4) 0%, rgba(226,255,238,0) 72%); filter: blur(6px);"></div>

  <!-- fine dust texture -->
  <div style="position: absolute; inset: 0; opacity: 0.5; background-image: radial-gradient(rgba(255,255,255,0.9) 1px, transparent 1px), radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px); background-size: 90px 90px, 140px 140px; background-position: 0 0, 45px 70px;"></div>

  <!-- Cluster A: small, newly opened tab -->
  <div style="position: absolute; left: 168px; top: 560px;">
    <div style="position: absolute; left: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0) 68%); filter: blur(4px);"></div>
    <div style="position: absolute; left: 6px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #d9c9ff 60%, rgba(217,201,255,0) 100%); box-shadow: 0 0 22px rgba(217,201,255,0.9);"></div>
    <div style="position: absolute; left: 46px; top: 26px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #ffd6e0 60%, rgba(255,214,224,0) 100%); box-shadow: 0 0 14px rgba(255,214,224,0.85);"></div>
    <div style="position: absolute; left: -18px; top: 34px; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 12px rgba(255,255,255,0.9);"></div>
  </div>

  <!-- Cluster B: mid-grown tab -->
  <div style="position: absolute; left: 560px; top: 300px;">
    <div style="position: absolute; left: -110px; top: -100px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(199,214,255,0.28) 45%, rgba(199,214,255,0) 72%); filter: blur(3px);"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #ffffff, #bfd3ff 55%, rgba(191,211,255,0) 100%); box-shadow: 0 0 34px rgba(191,211,255,0.95);"></div>
    <div style="position: absolute; left: 66px; top: -34px; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #ffe3c2 60%, rgba(255,227,194,0) 100%); box-shadow: 0 0 18px rgba(255,227,194,0.9);"></div>
    <div style="position: absolute; left: -52px; top: 30px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #d9c9ff 60%, rgba(217,201,255,0) 100%); box-shadow: 0 0 16px rgba(217,201,255,0.85);"></div>
    <div style="position: absolute; left: 30px; top: 58px; width: 11px; height: 11px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 12px rgba(255,255,255,0.9);"></div>
    <div style="position: absolute; left: -20px; top: -46px; width: 9px; height: 9px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.85);"></div>
  </div>

  <!-- Cluster C: long-running, heavily upgraded tab -->
  <div style="position: absolute; left: 1030px; top: 470px;">
    <div style="position: absolute; left: -190px; top: -180px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(230,204,255,0.32) 40%, rgba(230,204,255,0) 72%); filter: blur(2px);"></div>
    <div style="position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #ffffff, #e0c8ff 55%, rgba(224,200,255,0) 100%); box-shadow: 0 0 54px rgba(224,200,255,1);"></div>
    <div style="position: absolute; left: 96px; top: -50px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #ffd6e0 60%, rgba(255,214,224,0) 100%); box-shadow: 0 0 24px rgba(255,214,224,0.95);"></div>
    <div style="position: absolute; left: -78px; top: 20px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #bfd3ff 60%, rgba(191,211,255,0) 100%); box-shadow: 0 0 22px rgba(191,211,255,0.9);"></div>
    <div style="position: absolute; left: 40px; top: 78px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #ffe3c2 60%, rgba(255,227,194,0) 100%); box-shadow: 0 0 18px rgba(255,227,194,0.9);"></div>
    <div style="position: absolute; left: -40px; top: -58px; width: 12px; height: 12px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 14px rgba(255,255,255,0.9);"></div>
    <div style="position: absolute; left: 118px; top: 26px; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 12px rgba(255,255,255,0.85);"></div>
    <div style="position: absolute; left: 20px; top: -90px; width: 8px; height: 8px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.8);"></div>
  </div>

  <!-- wordmark -->
  <div style="position: absolute; left: 56px; top: 52px;">
    <div style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 34px; color: #4a3d5c; letter-spacing: 0.01em;">浮遊光庭</div>
    <div style="margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; color: #8a7fa3; text-transform: uppercase;">ambient tab garden</div>
  </div>

  <!-- stats glass panel -->
  <div style="position: absolute; right: 48px; top: 48px; width: 258px; padding: 22px 22px 18px; border-radius: 22px; background: rgba(255,255,255,0.38); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 24px 60px rgba(150,140,200,0.18), inset 0 1px 0 rgba(255,255,255,0.9);">
    <div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #7a6f95; text-transform: uppercase;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a893d4" stroke-width="1.6"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>
      current session
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px;">
      <div style="font-family: 'Outfit', sans-serif; font-size: 13px; color: #6b6084;">きらめき</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: #4a3d5c;">12,480</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px;">
      <div style="font-family: 'Outfit', sans-serif; font-size: 13px; color: #6b6084;">開いているタブ</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: #4a3d5c;">3</div>
    </div>
    <div style="height: 1px; background: rgba(150,140,200,0.22); margin: 14px 0 10px;"></div>
    <div style="font-family: 'Outfit', sans-serif; font-size: 11px; color: #8a7fa3;">最長放置 4時間12分 / タブC</div>
  </div>

  <!-- upgrade glass panel -->
  <div style="position: absolute; left: 48px; bottom: 44px; width: 340px; padding: 20px; border-radius: 22px; background: rgba(255,255,255,0.34); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 24px 60px rgba(150,140,200,0.16), inset 0 1px 0 rgba(255,255,255,0.9);">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #7a6f95; text-transform: uppercase; margin-bottom: 14px;">upgrades</div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid rgba(150,140,200,0.18);">
      <div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 14px; color: #4a3d5c; font-weight: 500;">粒子密度 +</div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 11px; color: #8a7fa3; margin-top: 2px;">クラスタあたりの粒子数を増やす</div>
      </div>
      <button style="border: none; border-radius: 12px; padding: 8px 14px; background: linear-gradient(135deg, #cdbcff, #a893d4); color: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; box-shadow: 0 8px 18px rgba(168,147,212,0.5);">500</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid rgba(150,140,200,0.18);">
      <div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 14px; color: #4a3d5c; font-weight: 500;">軌道エフェクト</div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 11px; color: #8a7fa3; margin-top: 2px;">粒子がゆるく周回するようになる</div>
      </div>
      <button style="border: none; border-radius: 12px; padding: 8px 14px; background: linear-gradient(135deg, #cdbcff, #a893d4); color: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; box-shadow: 0 8px 18px rgba(168,147,212,0.5);">1,200</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 2px;">
      <div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 14px; color: #c3bbd4; font-weight: 500;">発光強化</div>
        <div style="font-family: 'Outfit', sans-serif; font-size: 11px; color: #b6aecb; margin-top: 2px;">きらめきが足りません</div>
      </div>
      <button style="border: 1px solid rgba(150,140,200,0.3); border-radius: 12px; padding: 8px 14px; background: transparent; color: #b6aecb; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500;">3,000</button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
