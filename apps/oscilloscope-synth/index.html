<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>オシロスコープ・サウンドアート | XYシンセ描画</title>
    <meta
      name="description"
      content="円形スコープ画面に描いた軌跡をそのままステレオ波形として合成し、フォスファーグリーンの光跡で再描画しながら鳴らす、逆方向のオシロスコープ・ミュージック制作ツール。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101208'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2339ff6a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2339ff6a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <main class="console" aria-label="オシロスコープ・サウンドアート XYシンセ描画">
        <header class="nameplate">
          <h1>OSCILLOSCOPE SYNTH</h1>
          <p class="nameplate-sub">MODEL SP&#8209;512 &middot; XY VECTOR SYNTHESIZER</p>
        </header>

        <div class="console-grid">
          <section class="panel panel-left" aria-label="図形スタンプと鋭さ">
            <div class="panel-block">
              <h2 class="panel-label">SHAPE STAMP</h2>
              <div class="stamp-grid" id="stampGrid"></div>
            </div>
            <div class="panel-block">
              <div class="knob-label-row">
                <label class="knob-label" for="sharpnessSlider">SHARPNESS</label>
                <span class="knob-value" id="sharpnessValue">55%</span>
              </div>
              <input type="range" id="sharpnessSlider" min="0" max="100" value="55" class="knob-slider" />
              <p class="knob-hint">CORNER&nbsp;&rarr;&nbsp;HARMONIC CONTENT</p>
            </div>
            <div class="panel-block button-row">
              <button id="undoBtn" class="switch-btn" type="button" disabled>UNDO</button>
              <button id="clearBtn" class="switch-btn" type="button">CLEAR</button>
            </div>
          </section>

          <section class="panel panel-center" aria-label="スコープ画面">
            <div class="bezel">
              <canvas
                id="scopeCanvas"
                aria-label="円形オシロスコープ描画面。ドラッグまたはタッチで軌跡を描くと、その形がそのまま音になります"
              ></canvas>
              <div class="scanlines" aria-hidden="true"></div>
              <div class="vignette" aria-hidden="true"></div>
              <div class="glass-glare" aria-hidden="true"></div>
            </div>
            <div class="status-row">
              <div class="led-indicator" id="ledPlay">
                <span class="led-dot"></span>PLAY
              </div>
              <div class="led-indicator amber" id="ledRec">
                <span class="led-dot"></span>REC / EXPORT
              </div>
            </div>
          </section>

          <section class="panel panel-right" aria-label="数値リードアウト・再生・書き出し">
            <div class="readout-panel">
              <div class="readout">
                <span class="readout-label">FREQ</span>
                <span class="readout-value" id="freqReadout">220<small>HZ</small></span>
              </div>
              <div class="readout">
                <span class="readout-label">LEVEL</span>
                <span class="readout-value" id="dbReadout">&minus;60<small>DB</small></span>
              </div>
              <div class="readout">
                <span class="readout-label">SAMPLES</span>
                <span class="readout-value" id="samplesReadout">512<small>SMP</small></span>
              </div>
              <div class="readout">
                <span class="readout-label">STATE</span>
                <span class="readout-value" id="stateReadout">IDLE</span>
              </div>
            </div>

            <div class="panel-block">
              <div class="knob-label-row">
                <label class="knob-label" for="freqSlider">FREQUENCY</label>
                <span class="knob-value" id="freqSliderValue">220 HZ</span>
              </div>
              <input type="range" id="freqSlider" min="30" max="600" value="220" class="knob-slider" />
            </div>
            <div class="panel-block">
              <div class="knob-label-row">
                <label class="knob-label" for="volSlider">VOLUME</label>
                <span class="knob-value" id="volSliderValue">60%</span>
              </div>
              <input type="range" id="volSlider" min="0" max="100" value="60" class="knob-slider" />
            </div>

            <div class="panel-block button-row transport-row">
              <button id="playBtn" class="switch-btn" type="button" disabled>PLAY</button>
              <button id="pauseBtn" class="switch-btn" type="button" disabled>PAUSE</button>
              <button id="stopBtn" class="switch-btn" type="button" disabled>STOP</button>
            </div>

            <div class="panel-block export-block">
              <h2 class="panel-label">EXPORT</h2>
              <div class="button-row">
                <button id="exportWavBtn" class="switch-btn" type="button" disabled>WAV</button>
                <button id="exportPngBtn" class="switch-btn" type="button" disabled>PNG</button>
                <button id="exportGifBtn" class="switch-btn" type="button" disabled>GIF</button>
              </div>
              <div class="progress-track" id="exportProgressTrack" hidden>
                <div class="progress-fill" id="exportProgressFill"></div>
              </div>
              <p class="export-status" id="exportStatus" aria-live="polite">&nbsp;</p>
            </div>
          </section>
        </div>
        <p class="footnote">
          すべてブラウザ内で完結します。データは送信されません。
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
