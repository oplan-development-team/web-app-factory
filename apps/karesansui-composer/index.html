<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>枯山水コンポーザー — Karesansui Composer</title>
    <meta
      name="description"
      content="石を置くと、その周りに砂紋（箒目）が自動で流れる禅庭シミュレーター。完成した庭園はポスターとして書き出せます。"
    />
  </head>
  <body>
    <div id="app">
      <main class="stage" id="stage">
        <div class="mat-frame" id="mat-frame">
          <canvas id="garden-canvas" aria-label="枯山水キャンバス。クリックで石を置き、ドラッグで移動できます。"></canvas>

          <div class="empty-state" id="empty-state">
            <p class="empty-state__eyebrow">白紙の庭</p>
            <p class="empty-state__lead">石を置くと、砂紋が自ずと流れはじめます</p>
            <p class="empty-state__hint">クリックまたはタップで石を配置</p>
            <button type="button" class="btn btn--ghost" id="btn-load-sample-empty">
              サンプル庭園を読み込む
            </button>
          </div>

          <div class="stone-toolbar" id="stone-toolbar" hidden>
            <label class="stone-toolbar__label" for="stone-size-slider">石の大きさ</label>
            <input type="range" id="stone-size-slider" min="0" max="100" step="1" value="50" />
            <button type="button" class="stone-toolbar__delete" id="btn-delete-stone" title="この石を削除" aria-label="この石を削除">
              削除
            </button>
          </div>
        </div>

        <p class="canvas-caption" id="canvas-caption">
          <span id="caption-ratio">方丈の比率　16 : 10</span>
          <span class="canvas-caption__sep">・</span>
          <span id="caption-stone-count">石　0 / 20</span>
        </p>
      </main>

      <aside class="gallery-panel" aria-label="操作パネル">
        <header class="gallery-panel__header">
          <p class="gallery-panel__kicker">DRY LANDSCAPE STUDIO</p>
          <h1 class="gallery-panel__title">枯山水<br />コンポーザー</h1>
          <p class="gallery-panel__subtitle">Karesansui Composer</p>
        </header>

        <section class="panel-section" aria-labelledby="label-ratio">
          <h2 class="panel-section__label" id="label-ratio">用紙の比率</h2>
          <div class="ratio-options" id="ratio-options" role="group" aria-labelledby="label-ratio">
            <button type="button" class="ratio-btn" data-ratio="horizontal">方丈 16:10</button>
            <button type="button" class="ratio-btn" data-ratio="square">正方形 1:1</button>
            <button type="button" class="ratio-btn" data-ratio="vertical">縦長ポスター</button>
          </div>
        </section>

        <section class="panel-section" aria-labelledby="label-sand">
          <h2 class="panel-section__label" id="label-sand">砂紋の調子</h2>

          <div class="field">
            <div class="field__row">
              <label for="slider-density">線の間隔</label>
              <span class="field__value" id="value-density">24</span>
            </div>
            <input type="range" id="slider-density" min="14" max="42" step="1" value="24" />
          </div>

          <div class="field">
            <div class="field__row">
              <label for="slider-influence">石への寄り添い</label>
              <span class="field__value" id="value-influence">150</span>
            </div>
            <input type="range" id="slider-influence" min="40" max="320" step="5" value="150" />
          </div>

          <div class="field">
            <div class="field__row">
              <label for="slider-angle">流れの向き</label>
              <span class="field__value" id="value-angle">30°</span>
            </div>
            <input type="range" id="slider-angle" min="0" max="180" step="1" value="30" />
          </div>

          <div class="field">
            <div class="field__row">
              <label for="slider-amplitude">うねりの幅</label>
              <span class="field__value" id="value-amplitude">0</span>
            </div>
            <input type="range" id="slider-amplitude" min="0" max="60" step="1" value="0" />
          </div>

          <div class="field">
            <div class="field__row">
              <label for="slider-period">うねりの周期</label>
              <span class="field__value" id="value-period">220</span>
            </div>
            <input type="range" id="slider-period" min="80" max="480" step="10" value="220" />
          </div>
        </section>

        <section class="panel-section" aria-labelledby="label-garden">
          <h2 class="panel-section__label" id="label-garden">庭園の操作</h2>
          <div class="btn-stack">
            <button type="button" class="btn btn--line" id="btn-undo" disabled>元に戻す（Ctrl+Z）</button>
            <button type="button" class="btn btn--line" id="btn-load-sample">サンプル庭園を読み込む</button>
            <button type="button" class="btn btn--line" id="btn-clear">空の庭に戻す</button>
          </div>
        </section>

        <section class="panel-section panel-section--export" aria-labelledby="label-export">
          <h2 class="panel-section__label" id="label-export">書き出し</h2>
          <div class="btn-stack">
            <button type="button" class="btn btn--accent" id="btn-export-png">PNG（ポスター）を書き出す</button>
            <button type="button" class="btn btn--accent-outline" id="btn-export-svg">SVG（版下）を書き出す</button>
          </div>
        </section>

        <footer class="gallery-panel__footer">
          <p>石を配置すると、その周りを縫うように箒目が自ずと流れます。</p>
          <p class="gallery-panel__footer-note">状態は保存されません — リロードで初期化されます</p>
        </footer>
      </aside>
    </div>

    <div id="toast-root" aria-live="polite"></div>
    <div id="dialog-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
