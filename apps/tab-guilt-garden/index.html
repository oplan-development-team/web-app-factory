<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タブ庭園 / Tab Guilt Garden</title>
    <meta
      name="description"
      content="開いたタブごとに苗が生え、放置するとしおれ、閉じると墓標が残る自虐ジョーク型ブラウザ庭園。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="header-inner">
          <p class="eyebrow mono">同一ブラウザ・タブ限定 / サーバーなし・保存はこの端末だけ</p>
          <h1 class="site-title">あなたの罪の庭</h1>
          <p class="site-tagline" id="tab-count-line">読み込み中...</p>
        </div>
        <div class="header-actions">
          <a id="add-tab-link" class="btn btn-mustard" href="./" target="_blank" rel="noopener noreferrer">
            + 新しい罪を開く
          </a>
          <button id="reset-btn" class="btn btn-outline" type="button">庭を焼き払う</button>
        </div>
      </header>

      <section class="stats-strip" id="stats-strip" aria-label="罪のスコア"></section>

      <main class="layout">
        <section class="garden-section" aria-labelledby="garden-heading">
          <div class="section-heading">
            <h2 id="garden-heading">生存中の苗</h2>
            <p class="section-note mono">フォーカスを外すとしおれる。戻れば助かる。</p>
          </div>
          <p class="empty-state" id="garden-empty" hidden>
            庭はまだ空っぽ。「+ 新しい罪を開く」でタブを増やし、罪を重ねよう。
          </p>
          <div class="garden-grid" id="garden-grid"></div>
        </section>

        <section class="graveyard-section" aria-labelledby="graveyard-heading">
          <div class="section-heading">
            <h2 id="graveyard-heading">墓標(過去の罪)</h2>
            <p class="section-note mono">閉じたタブがここに眠る。安らかに、とは言っていない。</p>
          </div>
          <p class="empty-state" id="graveyard-empty" hidden>
            まだ何も葬っていない。あなたはまだ誠実なタブ管理者だ(今のところは)。
          </p>
          <div class="graveyard-grid" id="graveyard-grid"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          タブごとに苗が育ち、フォーカスを外した実時間ぶんしおれ、閉じれば墓標が残る。同期はこのブラウザ内のタブ同士のみ、他ブラウザ・他端末とは共有されない。
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
