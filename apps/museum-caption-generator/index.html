<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="手元の写真を、架空の現代アート展の壁面解説文（キャプション）に仕立てるジョークツール。画像は端末外に送信されません。" />
    <meta name="theme-color" content="#0d0c0a" />
    <title>架空美術館 キャプション生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <p class="eyebrow">Archive of Imaginary Works</p>
        <h1 class="site-title">架空美術館<br class="title-break" />キャプション生成器</h1>
        <p class="site-sub">手元の一枚を、現代アート展の展示品に仕立てます。</p>
      </header>

      <main>
        <section id="upload-section" class="upload-section">
          <label id="dropzone" class="dropzone" for="file-input">
            <svg class="dropzone-icon" viewBox="0 0 48 48" aria-hidden="true">
              <rect x="6" y="8" width="36" height="28" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" />
              <circle cx="16" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M6 30l10-9 8 7 6-5 12 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            <span class="dropzone-text">写真をドラッグ、またはタップして選択</span>
            <span class="dropzone-hint">JPEG / PNG / WebP・処理はすべて端末内で完結します</span>
          </label>
          <input id="file-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" />
          <p id="upload-error" class="upload-error" role="alert" hidden></p>
        </section>

        <section id="exhibit-section" class="exhibit-section" hidden>
          <div class="gallery-wall">
            <div class="spotlight" aria-hidden="true"></div>
            <figure class="exhibit-figure">
              <img id="exhibit-image" alt="展示作品として表示されたアップロード画像" />
            </figure>
          </div>

          <article id="plate" class="plate" aria-live="polite"></article>

          <div class="controls">
            <button id="regenerate-btn" type="button" class="btn btn-outline">
              <span>キャプションを引き直す</span>
            </button>
            <button id="copy-btn" type="button" class="btn btn-outline">
              <span>本文をコピー</span>
            </button>
            <button id="download-btn" type="button" class="btn btn-primary">
              <span>展示画像として保存</span>
            </button>
            <button id="reset-btn" type="button" class="btn btn-ghost">
              <span>別の写真を選ぶ</span>
            </button>
          </div>
          <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        </section>
      </main>

      <footer class="site-footer">
        <p>すべての解析・生成・画像合成は端末内のブラウザだけで行われます。写真がサーバーへ送信されることはありません。</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
