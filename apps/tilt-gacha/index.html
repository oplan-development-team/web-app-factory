<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="端末を振ると、そのときの傾きに応じた幾何学模様が1枚出現する。集めて図鑑を埋めていく感覚トイ。"
    />
    <title>傾きガチャ — Tilt Gacha</title>
  </head>
  <body>
    <!-- 画面全体に敷く微細な粒子。地の #0b0b0c が平坦に見えないようにする -->
    <div class="grain" aria-hidden="true"></div>

    <div class="app">
      <!-- ================= 待機画面 ================= -->
      <section class="screen standby" data-screen="standby" data-active="true">
        <p class="wordmark">Tilt Gacha</p>

        <div class="standby__stage">
          <!-- 出現前のヒントとしての薄い模様。実際の生成器で描く -->
          <div class="ghost" data-standby-ghost aria-hidden="true"></div>

          <div class="standby__copy">
            <h1 class="standby__headline" data-standby-headline>端末を振ってみてください</h1>
            <p class="standby__sub" data-standby-sub>持ち方によって出やすい模様が変わります</p>
          </div>
        </div>

        <button class="pill-button pill-button--outline" type="button" data-shake-button>
          <span class="pill-button__icon" data-shake-icon aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" width="20" height="20">
              <rect x="9" y="4" width="14" height="24" rx="3" stroke="currentColor" stroke-width="1.4" />
              <path d="M4,10 C0,14 0,18 4,22" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              <path d="M28,10 C32,14 32,18 28,22" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </span>
          <span class="pill-button__label" data-shake-label>振ってみる</span>
        </button>

        <p class="standby__note" data-shake-hint></p>

        <!-- 傾き→系統の対応は表で説明せず、アイコン列で控えめに示す -->
        <ul class="tilt-hints" data-tilt-hints></ul>

        <button class="link-button" type="button" data-open-collection>
          <span class="link-button__label">図鑑 <span data-standby-progress>0 / 12</span></span>
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path d="M2,1 L7,5 L2,9" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </section>

      <!-- ================= 出現演出画面 ================= -->
      <section
        class="screen reveal"
        data-screen="reveal"
        data-active="false"
        aria-hidden="true"
        inert
      >
        <div class="reveal__bar">
          <button class="icon-button" type="button" data-close-reveal aria-label="待機画面へ戻る">
            <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
              <path d="M1,1 L13,13 M13,1 L1,13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <span class="reveal__type" data-reveal-type>TYPE 01 / 12</span>
        </div>

        <div class="reveal__stage" data-reveal-stage>
          <div class="reveal__glow" data-reveal-glow aria-hidden="true"></div>
          <p class="first-badge" data-reveal-first hidden>はじめて発見</p>
          <div class="reveal__art" data-reveal-art></div>
        </div>

        <div class="reveal__identity">
          <h2 class="reveal__family">
            <span class="reveal__family-en" data-reveal-family-en>FLOW</span>
            <span class="reveal__family-ja" data-reveal-family-ja>ながれ</span>
          </h2>
          <p class="rarity-badge" data-reveal-rarity>COMMON · コモン</p>
          <p class="reveal__tilt" data-reveal-tilt>検出した傾き: たて</p>
        </div>

        <div class="reveal__actions">
          <button class="pill-button pill-button--outline" type="button" data-open-collection>
            <span class="pill-button__label">図鑑を見る</span>
          </button>
          <button class="pill-button pill-button--solid" type="button" data-shake-again>
            <span class="pill-button__label">もう一度振る</span>
          </button>
        </div>
      </section>

      <!-- ================= 図鑑画面 ================= -->
      <section
        class="screen collection"
        data-screen="collection"
        data-active="false"
        aria-hidden="true"
        inert
      >
        <div class="collection__head">
          <button class="icon-button" type="button" data-close-collection aria-label="前の画面へ戻る">
            <svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true">
              <path d="M9,1 L1,8 L9,15" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <h2 class="collection__title">図鑑</h2>
        </div>

        <div class="collection__stat">
          <p class="collection__count">
            <span data-collection-count>0 / 12</span> CATALOGUED
          </p>
          <div
            class="meter"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="12"
            aria-valuenow="0"
            aria-label="図鑑の収集進捗"
          >
            <span class="meter__fill" data-collection-meter-fill></span>
          </div>
          <p class="collection__note" data-collection-note hidden></p>
        </div>

        <div class="collection__body" data-collection-sections></div>
      </section>
    </div>

    <p class="visually-hidden" role="status" aria-live="polite" data-live></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
