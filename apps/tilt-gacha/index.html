<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="端末を振ると、そのときの傾きに応じた幾何学模様が1枚出現する。集めて図鑑を埋めていく感覚トイ。"
    />
    <title>傾きガチャ — Tilt Gacha</title>
  </head>
  <body>
    <!-- 画面全体に敷く微細な粒子。地の #0b0b0c が平坦に見えないようにする -->
    <div class="grain" aria-hidden="true"></div>

    <div class="app">
      <!-- ================= 待機画面 ================= -->
      <section class="screen standby" data-screen="standby" data-active="true">
        <header class="masthead">
          <p class="eyebrow">TILT GACHA</p>
          <h1 class="wordmark">傾き<span class="wordmark__break">ガチャ</span></h1>
          <p class="lede">
            端末を振ると、そのときの<em>傾き</em>に応じた模様が1枚出る。<br />
            12種の型をすべて見つけて図鑑を埋める。
          </p>
        </header>

        <div class="standby__stage">
          <div class="dial" data-standby-dial aria-hidden="true">
            <span class="dial__ring"></span>
            <span class="dial__ring"></span>
            <span class="dial__ring"></span>
          </div>
          <p class="standby__state" data-standby-state>4方向の傾きが、4つの系統と響き合う。</p>
        </div>

        <ul class="affinity" data-affinity>
          <li><span class="affinity__tilt">たて</span><span class="affinity__family">FLOW / ながれ</span></li>
          <li><span class="affinity__tilt">よこ</span><span class="affinity__family">GRID / こうし</span></li>
          <li><span class="affinity__tilt">ななめ</span><span class="affinity__family">RADIAL / ほうしゃ</span></li>
          <li><span class="affinity__tilt">さかさま</span><span class="affinity__family">NOISE / ゆらぎ</span></li>
        </ul>

        <div class="standby__foot">
          <button class="bar-button" type="button" data-shake-button>
            <span class="bar-button__label" data-shake-label>振ってみる</span>
            <span class="bar-button__hint" data-shake-hint>タップしてセンサーを起動</span>
          </button>
          <button class="ghost-button" type="button" data-open-collection>
            図鑑を見る
            <span class="ghost-button__count" data-standby-progress>0 / 12</span>
          </button>
        </div>
      </section>

      <!-- ================= 出現演出画面 ================= -->
      <section
        class="screen reveal"
        data-screen="reveal"
        data-active="false"
        aria-hidden="true"
        inert
      >
        <p class="reveal__index" data-reveal-index aria-hidden="true">№ 000</p>

        <div class="reveal__stage" data-reveal-stage>
          <div class="reveal__glow" data-reveal-glow aria-hidden="true"></div>
          <div class="reveal__art" data-reveal-art></div>
        </div>

        <div class="reveal__meta">
          <p class="reveal__badges">
            <span class="rarity-badge" data-reveal-rarity>COMMON</span>
            <span class="first-badge" data-reveal-first hidden>はじめて発見</span>
          </p>
          <h2 class="reveal__family">
            <span class="reveal__family-en" data-reveal-family-en>FLOW</span>
            <span class="reveal__family-ja" data-reveal-family-ja>ながれ</span>
          </h2>
          <p class="reveal__tilt" data-reveal-tilt>検出した傾き: たて</p>
        </div>

        <div class="reveal__actions">
          <button class="bar-button" type="button" data-shake-again>
            <span class="bar-button__label">もう一度振る</span>
          </button>
          <button class="ghost-button" type="button" data-open-collection>
            図鑑を見る
            <span class="ghost-button__count" data-reveal-progress>0 / 12</span>
          </button>
        </div>
      </section>

      <!-- ================= 図鑑画面 ================= -->
      <section
        class="screen collection"
        data-screen="collection"
        data-active="false"
        aria-hidden="true"
        inert
      >
        <header class="collection__head">
          <button class="back-button" type="button" data-close-collection>
            <span aria-hidden="true">←</span> もどる
          </button>
          <p class="collection__count">
            <span data-collection-count>0 / 12</span>
            <span class="collection__count-label">CATALOGUED</span>
          </p>
          <div
            class="meter"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="12"
            aria-valuenow="0"
            aria-label="図鑑の収集進捗"
            data-collection-meter
          >
            <span class="meter__fill" data-collection-meter-fill></span>
          </div>
          <p class="collection__note" data-collection-note hidden></p>
        </header>

        <div class="collection__body" data-collection-sections></div>
      </section>
    </div>

    <p class="visually-hidden" role="status" aria-live="polite" data-live></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
