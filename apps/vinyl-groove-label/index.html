<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinyl Groove Label — サウンド・レコードレーベル・ジェネレーター</title>
    <meta
      name="description"
      content="音声ファイルやマイク録音の波形を、レコード盤の溝の間隔・太さ・明度に刻み込んでレーベルデザインを生成し、高解像度PNGで書き出すジェネレーター。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0907'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%238a6425' stroke-width='0.6'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%238a6425' stroke-width='0.6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c9a24b'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%230a0907'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="brand-bar">
        <span class="brand-bar__kicker">SOUND &middot; RECORD LABEL GENERATOR</span>
        <h1 class="brand-bar__title">VINYL GROOVE LABEL</h1>
        <span class="brand-bar__note">波形を、盤に刻む。</span>
      </header>

      <main class="layout">
        <section class="stage" id="stage" aria-label="盤面プレビュー">
          <div class="stage__spotlight" aria-hidden="true"></div>
          <canvas id="disc-canvas" class="stage__canvas" width="900" height="900"></canvas>
          <div class="stage__overlay" id="stage-overlay" role="status" aria-live="polite"></div>
        </section>

        <aside class="panel" id="panel" aria-label="操作パネル">
          <section class="panel__section" aria-label="音声入力">
            <h2 class="panel__heading">01 &mdash; SOURCE AUDIO</h2>
            <div class="input-tabs" role="tablist">
              <button type="button" class="input-tabs__btn is-active" id="tab-file" role="tab" aria-selected="true">ファイル</button>
              <button type="button" class="input-tabs__btn" id="tab-mic" role="tab" aria-selected="false">マイク</button>
            </div>

            <div class="input-pane" id="pane-file">
              <label class="dropzone" id="dropzone" for="file-input">
                <span class="dropzone__label">音声ファイルをドロップ、またはクリックして選択</span>
                <span class="dropzone__hint">MP3 / WAV / M4A 等</span>
              </label>
              <input type="file" id="file-input" accept="audio/*" hidden />
            </div>

            <div class="input-pane" id="pane-mic" hidden>
              <div class="mic-control">
                <button type="button" class="btn btn--brass" id="mic-toggle">録音開始</button>
                <span class="mic-control__timer" id="mic-timer">00:00 / 00:30</span>
              </div>
              <div class="level-meter" id="level-meter" aria-hidden="true">
                <div class="level-meter__bar" id="level-meter-bar"></div>
              </div>
            </div>

            <div class="source-info" id="source-info" hidden>
              <div class="source-info__text">
                <span class="source-info__name" id="source-name">&mdash;</span>
                <span class="source-info__meta" id="source-meta">&mdash;</span>
              </div>
              <button type="button" class="btn btn--ghost" id="reset-btn">破棄してやり直す</button>
            </div>
          </section>

          <section class="panel__section" aria-label="レーベル文字情報">
            <h2 class="panel__heading">02 &mdash; LABEL TEXT</h2>
            <div class="field">
              <label class="field__label" for="input-title">タイトル <span class="field__required">必須</span></label>
              <input class="field__input" id="input-title" type="text" maxlength="40" placeholder="例：MIDNIGHT SESSIONS" />
            </div>
            <div class="field">
              <label class="field__label" for="input-artist">アーティスト名 <span class="field__required">必須</span></label>
              <input class="field__input" id="input-artist" type="text" maxlength="40" placeholder="例：THE QUIET ENGINE" />
            </div>
            <div class="field-row">
              <div class="field field--half">
                <label class="field__label" for="input-catalog">カタログ番号</label>
                <input class="field__input field__input--mono" id="input-catalog" type="text" maxlength="16" placeholder="VGL-001" />
              </div>
              <div class="field field--half">
                <label class="field__label" for="input-side">Side 表記</label>
                <input class="field__input field__input--mono" id="input-side" type="text" maxlength="10" placeholder="SIDE A" />
              </div>
            </div>
          </section>

          <section class="panel__section" aria-label="レーベル配色">
            <h2 class="panel__heading">03 &mdash; LABEL FINISH</h2>
            <div class="preset-list" id="preset-list" role="radiogroup"></div>
          </section>

          <section class="panel__section" aria-label="変調の強さ">
            <h2 class="panel__heading">04 &mdash; GROOVE DEFORMATION</h2>
            <div class="slider-row">
              <input class="slider" id="mod-strength" type="range" min="0" max="100" value="55" />
              <span class="slider-row__value" id="mod-strength-value">55%</span>
            </div>
            <p class="panel__hint">音量の変化を、溝の間隔・太さへどれだけ大げさに刻むか。</p>
          </section>

          <section class="panel__section panel__section--export" aria-label="書き出し">
            <button type="button" class="btn btn--brass btn--large" id="export-btn" disabled>PNGで書き出す（3000&times;3000）</button>
            <p class="export-status" id="export-status" role="status" aria-live="polite"></p>
            <p class="panel__footnote">
              音声はこの端末（ブラウザ）内でのみ解析されます。サーバーへの送信・保存は行われません。
            </p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
