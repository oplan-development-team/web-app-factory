name: app-factory nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch: {}

jobs:
  app-factory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "app-factory-bot"
          git config user.email "app-factory-bot@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill,Workflow,TodoWrite"
          prompt: |
            これはNew_Service_App（GitHubリポジトリ: oplan-development-team/web-app-factory）という
            プロジェクトの自律プロトタイピング・パイプラインを実行するジョブです。

            ## やること

            1. リポジトリルートの `.claude/CLAUDE.md` を読んで、このプロジェクトの方針を把握してください。
            2. `app-factory` スキルを呼び出し、その指示に従って `Workflow` ツールでアイディア出しから
               プロトタイプ完成までのパイプラインを実行してください（`.claude/skills/app-factory/SKILL.md` 参照）。
               ユーザー起点のアイディア（`args.seedIdea`）は指定しません。自律的にアイディアから生成してください。
            3. ワークフロー完了後は、`app-factory` スキルに書かれている「ワークフロー完了後にやること」の手順
               （apps/<slug>/の実在確認、QA/Verify結果の確認、PROJECTS.mdへの追記）に従ってください。
            4. 完了したら、新しいブランチ `app-factory/auto-<slug>`（<slug>は生成されたアプリのディレクトリ名に
               置き換える）を作成し、生成されたファイル一式とPROJECTS.mdの更新をコミットして、originにプッシュ
               してください。**mainには直接プッシュしないでください。**採否はユーザーが後で判断します。
            5. 最後に、生成されたアイディアの内容・採用理由・QA/Verifyの結果・プッシュ先のブランチ名を
               簡潔にまとめて報告してください。

            ## 制約

            - 外部有料APIキーや継続的なインフラ費用が前提のアイディアは避けてください
              （`.claude/agents/idea-scout.md` 等、既存のガイドラインに従ってください）
            - このGitHub Actionsランナーには通常Dockerが使えます。Dockerビルドの検証はそのまま実行してください
            - 作業はすべて `.claude/` 配下の既存の仕組み（エージェント・スキル・ワークフロー）に
              すでに定義されています。新しいルールを作らず、既存の指示に従ってください
